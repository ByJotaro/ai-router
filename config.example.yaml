# ai-router — пример конфигурации.
# Скопируйте в %LOCALAPPDATA%\ai-router\config.yaml
# (или сгенерируйте из opencode: go run ./cmd/import-opencode).
#
# Ключи провайдеров можно хранить в открытом виде или в формате enc:v1
# (см. секцию encryption) — панель шифрует их сама.

server:
  host: 127.0.0.1
  port: 9001
  log_level: info            # debug | info | warn | error

# Генерируется при первом запуске (64 hex). Нужен для панели и админ-API.
admin_token: <auto-generated, 64 hex>

# Регистрация как модуля хаба (необязательно).
hub:
  url: http://127.0.0.1:8700
  module: ai-router
  token: <token модуля из конфига хаба>
  addr: 127.0.0.1:9102
  register: true

providers:
  # Обычный провайдер с ключами: пул ключей + список моделей + fallback-цепь.
  openai:
    type: openai-compatible
    base_url: https://api.openai.com/v1
    api_keys:
      - <sk-...>
    models: [gpt-4o-mini, gpt-4o]
    fallbacks: [openrouter]
    timeout_s: 120

  anthropic:
    type: openai-compatible
    base_url: https://api.anthropic.com/v1
    api_keys:
      - <sk-ant-...>
    models: [claude-sonnet-4-5]

  deepseek:
    type: openai-compatible
    base_url: https://api.deepseek.com/v1
    api_keys:
      - <sk-...>
    models: [deepseek-chat, deepseek-reasoner]

  openrouter:
    type: openai-compatible
    base_url: https://openrouter.ai/api/v1
    api_keys:
      - <sk-or-...>
    models: [meta-llama/llama-3.3-70b-instruct]

  # Провайдер без ключа (публичный endpoint): auth_mode: none.
  # transport.mode: direct — запрос уходит напрямую, без egress-пула.
  public-endpoint:
    type: openai-compatible
    base_url: http://127.0.0.1:9009/v1
    api_keys: []
    auth_mode: none
    timeout_s: 300
    transport:
      mode: direct
    models: [example-free]

# Виртуальные ключи для клиентов: квоты и allowlist моделей.
# quota_tokens/quota_reqs = 0 — безлимит; пустой models — все модели.
keys:
  - name: домашний
    key: sk-local-...
    quota_tokens: 1000000
    quota_reqs: 100
    models: []               # пусто = все модели

# --- отказоустойчивость ---
resilience:
  breaker:  { max_failures: 5, recovery_seconds: 30, half_open_successes: 2 }
  cooldown: { base_seconds: 60, max_seconds: 3600, factor: 2.0, respect_retry_after: true }
  lockout:  { max_failures: -1, window_seconds: 300, lockout_seconds: 900 }  # -1 отключает лок моделей

routing:
  strategy: priority         # priority | weighted | round-robin | p2c | cost | lkgp
  tiers: [subscription, api, cheap, free]
  costs: { enabled: false }

# Шифрование ключей в state.db (enc:v1, AES-GCM). Ключ — из окружения.
encryption: { key_env: STORAGE_ENCRYPTION_KEY }
telemetry:  { headers: true, metrics: true }   # X-AiRouter-* заголовки в ответах (не наружу)
sanitize:   { errors: true }
idempotency: { enabled: false, ttl_seconds: 5 }

# Прокси-пул через модуль egress (:8801). enabled: true — каждый исходящий
# запрос идёт через прокси из пула (свежий канал при per_request).
egress:
  enabled: false
  base_url: http://127.0.0.1:8801
  token: <токен egress-модуля из конфига хаба>
  strategy: round_robin      # round_robin | best_latency | sticky
  rotation: { per_request: false, rotate_after: 10 }

# Транспорт провайдера (необязательно; по умолчанию direct):
#
#   transport:
#     mode: iprotate         # direct | iprotate | pool
#     fanout: 5              # iprotate: сколько параллельных попыток
#     rounds: 2
#     cooldown_s: 30
#     resolve_ttl_s: 60
#     api_url: http://127.0.0.1:8787   # pool: адрес пула egress
#     token: <токен пула>
