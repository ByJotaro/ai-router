<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" role="img" aria-labelledby="t d">
  <title id="t">ai-router module family</title>
  <desc id="d">Four standalone modules — ai-router (public beta), warp-router (private, in development), research (alpha, in development), pc-care (private beta) — linked by HTTP API calls. ai-router leases egress from warp-router; research and pc-care call the gateway's OpenAI-compatible API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#484f58"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="978" height="608" rx="16" fill="#0d1117" stroke="#30363d"/>

  <text x="32" y="38" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#8b949e" letter-spacing="1.4">MODULE FAMILY</text>
  <text x="32" y="58" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="12" fill="#6e7681">Four standalone apps. Every arrow is an HTTP call between their APIs — nothing is shared but the contract.</text>

  <!-- ============ edges (drawn first, cards sit on top) ============ -->
  <g fill="none" stroke="#484f58" stroke-width="1.6">
    <!-- ai-router -> warp-router : GET /pool/lease -->
    <path d="M383,272 H326 Q318,272 318,264 V160 Q318,152 310,152 H258" marker-end="url(#arrow)"/>
    <!-- research -> ai-router : POST /v1/chat/completions -->
    <path d="M726,152 H669 Q661,152 661,160 V264 Q661,272 653,272 H601" marker-end="url(#arrow)"/>
    <!-- pc-care -> ai-router : POST /v1/chat/completions -->
    <path d="M490,404 V372" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.5" fill="#8b949e" text-anchor="middle">
    <rect x="256" y="197" width="124" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
    <text x="318" y="212">GET /pool/lease</text>

    <rect x="599" y="197" width="124" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
    <text x="661" y="212">POST /v1</text>

    <text x="504" y="386" text-anchor="start">LLM advisory · /v1</text>
  </g>

  <!-- ============ cards ============ -->
  <!-- warp-router -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="40" y="86" width="214" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="54" y="100" width="122" height="20" rx="10" fill="#21262d"/>
    <text x="115" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#8b949e" letter-spacing="0.7">PRIVATE · IN DEV</text>
    <text x="54" y="150" font-size="17" font-weight="700" fill="#e6edf3">warp-router</text>
    <text x="54" y="172" font-size="10.5" fill="#8b949e">Egress pool for outbound</text>
    <text x="54" y="187" font-size="10.5" fill="#8b949e">traffic: WARP / Psiphon</text>
    <text x="54" y="205" font-size="9.5" fill="#6e7681">rotation · health · lease</text>
  </g>

  <!-- research -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="726" y="86" width="214" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="740" y="100" width="106" height="20" rx="10" fill="#2a1f3d"/>
    <text x="793" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="#a371f7" letter-spacing="0.7">ALPHA · IN DEV</text>
    <text x="740" y="150" font-size="17" font-weight="700" fill="#e6edf3">research</text>
    <text x="740" y="172" font-size="10.5" fill="#8b949e">Measurement harness:</text>
    <text x="740" y="187" font-size="10.5" fill="#8b949e">backtests, experiments</text>
    <text x="740" y="205" font-size="9.5" fill="#6e7681">evidence · reports · gates</text>
  </g>

  <!-- ai-router (hub) -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="383" y="232" width="214" height="132" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <rect x="397" y="246" width="96" height="20" rx="10" fill="#2d2410"/>
    <text x="445" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#d29922" letter-spacing="0.7">PUBLIC · BETA</text>
    <text x="397" y="296" font-size="17" font-weight="700" fill="#e6edf3">ai-router</text>
    <text x="397" y="318" font-size="10.5" fill="#8b949e">OpenAI-compatible gateway</text>
    <text x="397" y="333" font-size="10.5" fill="#8b949e">with a desktop panel</text>
    <text x="397" y="351" font-size="9.5" fill="#6e7681">keys · quotas · routing · logs</text>
  </g>

  <!-- pc-care -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <rect x="383" y="404" width="214" height="132" rx="12" fill="#161b22" stroke="#30363d"/>
    <rect x="397" y="418" width="112" height="20" rx="10" fill="#2d2410"/>
    <text x="453" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#d29922" letter-spacing="0.7">PRIVATE · BETA</text>
    <text x="397" y="468" font-size="17" font-weight="700" fill="#e6edf3">pc-care</text>
    <text x="397" y="490" font-size="10.5" fill="#8b949e">Windows cleanup &amp; health:</text>
    <text x="397" y="505" font-size="10.5" fill="#8b949e">what takes disk, what is safe</text>
    <text x="397" y="523" font-size="9.5" fill="#6e7681">scan · presets · reports</text>
  </g>

  <!-- footer -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" fill="#6e7681">
    <text x="32" y="568">Each module works on its own. Arrows are HTTP calls: ai-router leases egress from warp-router;</text>
    <text x="32" y="586">research and pc-care use the gateway's OpenAI-compatible /v1. Status as of 2026-10.</text>
  </g>
</svg>
